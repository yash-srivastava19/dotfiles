"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 200

format = "$directory$git_branch$git_status$character"

[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol   = "[❯](bold #f7768e)"


[directory]
style             = "bold #7aa2f7"
format            = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
repo_root_style   = "bold #7aa2f7"
repo_root_format  = "[ $repo_root$path ]($repo_root_style)"

[git_branch]
symbol = " "
style  = "bold #bb9af7"
format = "[$symbol$branch ]($style)"

[git_status]
style      = "#e0af68"
format     = "([$all_status$ahead_behind]($style) )"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
conflicted = "!"
untracked  = "?"
modified   = "~"
staged     = "+"
renamed    = "»"
deleted    = "✘"
up_to_date = ""

[time]
disabled = true
